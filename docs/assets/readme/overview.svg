<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
<title id="title">One source, many devices</title><desc id="desc">One source generates native configurations for desktop, mobile and OpenWrt. Supported clients provide 33 service and 22 regional groups; Karing and Xray have separate adapter limits. See client guides.</desc>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8ff"/><stop offset=".5" stop-color="#f4f8ff"/><stop offset="1" stop-color="#e7f3f7"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffffff" stop-opacity=".88"/><stop offset=".48" stop-color="#ffffff" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity=".57"/></linearGradient>
 <linearGradient id="ribbon" x1="0" x2="1"><stop stop-color="#166cd5"/><stop offset=".52" stop-color="#16a6b0"/><stop offset="1" stop-color="#8273cf"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#95c8ff" stop-opacity=".5"/><stop offset="1" stop-color="#95c8ff" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#51739b" flood-opacity=".09"/></filter>
 <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6384ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="1118" height="298" rx="28" fill="url(#base)" stroke="#c8ddee"/><ellipse cx="952" cy="15" rx="403.2" ry="225" fill="url(#aura)"/><path d="M28 1H1092" stroke="#ffffff" stroke-width="2"/>
<rect x="28" y="29" width="292" height="151" rx="23" fill="#e0edff" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="28.5" y="29.5" width="291" height="150" rx="23" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/><g transform="translate(244 52)" fill="none" stroke="#6b9ac8" stroke-width="1.6"><path d="M0 17L28 0L56 17L28 34ZM28 0V34M0 17H56"/><circle cx="28" cy="17" r="5" fill="#f5fbff"/></g>
  <text x="49" y="78" font-size="27" font-weight="650" fill="#18324f" >One policy source</text>
  <text x="49" y="118" font-size="20" font-weight="400" fill="#506780" >Shared routing policy</text><text x="49" y="148" font-size="20" font-weight="400" fill="#506780" >Preserve service match order</text>
  <path d="M332 105L384 105" fill="none" stroke="#6384ac" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="398" y="29" width="306" height="151" rx="23" fill="#d9f2ef" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="398.5" y="29.5" width="305" height="150" rx="23" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/>
  <text x="419" y="78" font-size="27" font-weight="650" fill="#18324f" >Native client configs</text>
  <text x="419" y="118" font-size="20" font-weight="400" fill="#506780" >Choose a client and import its config</text><text x="419" y="148" font-size="20" font-weight="400" fill="#506780" >Adapt to platform capabilities</text>
  <path d="M716 105L768 105" fill="none" stroke="#6384ac" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="782" y="29" width="310" height="151" rx="23" fill="#eae4fc" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="782.5" y="29.5" width="309" height="150" rx="23" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/><g transform="translate(1004 48)" fill="none" stroke="#7c80b0" stroke-width="1.7" stroke-linejoin="round"><rect width="43" height="28" rx="3"/><path d="M21 28V35M10 35H33"/><rect x="50" y="9" width="17" height="31" rx="3"/><path d="M56 35H61"/></g>
  <text x="803" y="78" font-size="27" font-weight="650" fill="#18324f" >Multi-device routing</text>
  <text x="803" y="118" font-size="20" font-weight="400" fill="#506780" >Desktop / Mobile / OpenWrt</text><text x="803" y="148" font-size="20" font-weight="400" fill="#506780" >Select exits by service</text>
  <path d="M34 206H1086" stroke="#c6d9e8"/>
  <text x="36" y="240" font-size="21" font-weight="650" fill="#18324f" >33 services / 22 regions</text>
  <text x="334" y="240" font-size="19" font-weight="400" fill="#506780" >Requires matching client capabilities</text>
  <text x="36" y="275" font-size="19" font-weight="400" fill="#506780" >Karing uses a native adapter; Xray has three exits. See client guides for limitations.</text>
</g></svg>
