<svg xmlns="http://www.w3.org/2000/svg" width="420" height="978" viewBox="0 0 420 978" role="img" aria-labelledby="title desc">
<title id="title">Mihomo DNS 四层分工</title><desc id="desc">窄屏版：启动引导完成后，国内业务、代理节点与海外业务是三个并行 DNS 通道，不是串行查询。</desc>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8ff"/><stop offset=".5" stop-color="#f4f8ff"/><stop offset="1" stop-color="#e7f3f7"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffffff" stop-opacity=".88"/><stop offset=".48" stop-color="#ffffff" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity=".57"/></linearGradient>
 <linearGradient id="ribbon" x1="0" x2="1"><stop stop-color="#166cd5"/><stop offset=".52" stop-color="#16a6b0"/><stop offset="1" stop-color="#8273cf"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#95c8ff" stop-opacity=".5"/><stop offset="1" stop-color="#95c8ff" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#51739b" flood-opacity=".09"/></filter>
 <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6384ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="418" height="976" rx="28" fill="url(#base)" stroke="#c8ddee"/><ellipse cx="357" cy="15" rx="151.2" ry="733.5" fill="url(#aura)"/><path d="M28 1H392" stroke="#ffffff" stroke-width="2"/>
<text x="24" y="42" font-size="25" font-weight="650" fill="#18324f" >DNS 四层分工</text><text x="24" y="71" font-size="18" font-weight="400" fill="#506780" >主线 Mihomo 配置示意</text>
  <rect x="24" y="91" width="372" height="126" rx="18" fill="#e0edff" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="24.5" y="91.5" width="371" height="125" rx="18" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/><text x="44" y="122" font-size="22" font-weight="650" fill="#18324f" >① 启动引导</text><text x="44" y="151" font-size="20" font-weight="600" fill="#18324f" >default-nameserver</text><text x="44" y="180" font-size="18" font-weight="400" fill="#506780" >DoH-over-IP + 明文兜底</text><text x="44" y="205" font-size="18" font-weight="400" fill="#506780" >仅为 DoH 服务域名提供引导解析</text>
  <text x="24" y="252" font-size="19" font-weight="600" fill="#18324f" >bootstrap 后，按域名性质分三路</text>
  <path d="M210 223V229M210 263V267H31V699" fill="none" stroke="#7b99b9" stroke-width="2.2"/>
  <path d="M31 350L47 350" fill="none" stroke="#6384ac" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M31 524L47 524" fill="none" stroke="#6384ac" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M31 698L47 698" fill="none" stroke="#6384ac" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="58" y="277" width="338" height="153" rx="18" fill="#ddf3ed" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="58.5" y="277.5" width="337" height="152" rx="18" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/><text x="78" y="310" font-size="22" font-weight="650" fill="#18324f" >② 国内业务域名</text><text x="78" y="341" font-size="18" font-weight="400" fill="#506780" >nameserver-policy / nameserver</text><text x="78" y="372" font-size="18" font-weight="400" fill="#506780" >geosite:cn → AliDNS / DNSPod</text><text x="78" y="403" font-size="18" font-weight="400" fill="#506780" >大陆站点与国内 CDN</text>
  <rect x="58" y="451" width="338" height="153" rx="18" fill="#e0edff" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="58.5" y="451.5" width="337" height="152" rx="18" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/><text x="78" y="484" font-size="22" font-weight="650" fill="#18324f" >③ 代理节点域名</text><text x="78" y="515" font-size="18" font-weight="400" fill="#506780" >proxy-server-nameserver</text><text x="78" y="546" font-size="18" font-weight="400" fill="#506780" >Cloudflare / Google</text><text x="78" y="577" font-size="18" font-weight="400" fill="#506780" >AliDNS / DNSPod · 活动节点 FQDN</text>
  <rect x="58" y="625" width="338" height="153" rx="18" fill="#ebe5fc" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="58.5" y="625.5" width="337" height="152" rx="18" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/><text x="78" y="658" font-size="22" font-weight="650" fill="#18324f" >④ 海外业务域名</text><text x="78" y="689" font-size="18" font-weight="400" fill="#506780" >nameserver-policy / fallback</text><text x="78" y="720" font-size="18" font-weight="400" fill="#506780" >geosite:geolocation-!cn</text><text x="78" y="751" font-size="18" font-weight="400" fill="#506780" >Cloudflare / Google · GeoIP CN</text>
  <text x="24" y="817" font-size="18" font-weight="400" fill="#506780" >业务查询优先使用加密 DoH；</text><text x="24" y="847" font-size="18" font-weight="400" fill="#506780" >ISP 可见性仍取决于 bootstrap、</text><text x="24" y="877" font-size="18" font-weight="400" fill="#506780" >客户端与网络路径。</text><text x="24" y="907" font-size="18" font-weight="400" fill="#506780" >其他客户端遵循各自原生 DNS；</text><text x="24" y="937" font-size="18" font-weight="400" fill="#506780" >Karing 的 DNS 由 App 设置维护。</text>
</g></svg>
