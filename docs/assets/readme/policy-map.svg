<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="432" viewBox="0 0 1120 432" role="img" aria-labelledby="title desc">
<title id="title">Service-to-region selection</title><desc id="desc">Service groups select available regional or residential endpoints. Client capabilities differ.</desc>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8ff"/><stop offset=".5" stop-color="#f4f8ff"/><stop offset="1" stop-color="#e7f3f7"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffffff" stop-opacity=".88"/><stop offset=".48" stop-color="#ffffff" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity=".57"/></linearGradient>
 <linearGradient id="ribbon" x1="0" x2="1"><stop stop-color="#166cd5"/><stop offset=".52" stop-color="#16a6b0"/><stop offset="1" stop-color="#8273cf"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#95c8ff" stop-opacity=".5"/><stop offset="1" stop-color="#95c8ff" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#51739b" flood-opacity=".09"/></filter>
 <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#6384ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="1118" height="430" rx="28" fill="url(#base)" stroke="#c8ddee"/><ellipse cx="952" cy="15" rx="403.2" ry="324" fill="url(#aura)"/><path d="M28 1H1092" stroke="#ffffff" stroke-width="2"/>
<text x="36" y="48" font-size="27" font-weight="650" fill="#18324f" >Service policies, regional exits</text>
  <text x="36" y="85" font-size="21" font-weight="650" fill="#18324f" >33 service groups</text><text x="526" y="85" font-size="21" font-weight="650" fill="#18324f" >22 regional groups</text><text x="947" y="85" font-size="21" font-weight="650" fill="#18324f" >Endpoints</text>
  <rect x="36" y="106" width="380" height="230" rx="20" fill="#e7edff" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="36.5" y="106.5" width="379" height="229" rx="20" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/>
  <text x="58" y="143" font-size="20" font-weight="400" fill="#18324f" >AI / Finance / Chat / Social / Work</text><text x="58" y="183" font-size="20" font-weight="400" fill="#18324f" >China / other streaming</text><text x="58" y="223" font-size="20" font-weight="400" fill="#18324f" >China / other games</text><text x="58" y="263" font-size="20" font-weight="400" fill="#18324f" >Tools / Platforms / Downloads / Trackers</text><text x="58" y="303" font-size="20" font-weight="400" fill="#18324f" >Sites / Ad blocking / Fallback</text>
  <path d="M424 220L469 220" fill="none" stroke="#6384ac" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="482" y="106" width="386" height="230" rx="20" fill="#dcf2f0" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="482.5" y="106.5" width="385" height="229" rx="20" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/>
  <text x="504" y="142" font-size="22" font-weight="650" fill="#18324f" >11 regions: all / residential</text>
  <text x="504" y="181" font-size="20" font-weight="400" fill="#18324f" >Global / HK / TW / SG</text><text x="504" y="215" font-size="20" font-weight="400" fill="#18324f" >JP / KR / APAC / US / EU</text><text x="504" y="249" font-size="20" font-weight="400" fill="#18324f" >Americas / Africa / Other</text>
  <text x="504" y="307" font-size="18" font-weight="400" fill="#506780" >Selection and automation vary by client</text>
  <path d="M876 220L922 220" fill="none" stroke="#6384ac" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="936" y="160" width="148" height="120" rx="20" fill="#e7e3fa" fill-opacity=".8" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/><rect x="936.5" y="160.5" width="147" height="119" rx="20" fill="url(#glass)" stroke="#a8c2dd" stroke-opacity=".48"/><text x="1010" y="203" font-size="20" font-weight="600" fill="#18324f" text-anchor="middle">Your subscription</text><text x="1010" y="238" font-size="18" font-weight="400" fill="#506780" text-anchor="middle">Cleaned and classified</text>
  <text x="36" y="380" font-size="18" font-weight="400" fill="#506780" >Groups may also select direct or block. This diagram applies only to clients with regional groups.</text>
  <text x="36" y="409" font-size="18" font-weight="400" fill="#506780" >See the guides for sing-box, Xray, Passwall and Karing group and endpoint limitations.</text>
</g></svg>
