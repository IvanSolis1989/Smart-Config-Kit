{
  "name": "Feature / rule request (English)",
  "description": "Propose a rule, client adapter or routing improvement with supporting evidence.",
  "title": "[Feature] ",
  "labels": [
    "enhancement"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Automated analysis may assist with triage or propose a fix, but it is not a guarantee of correctness or resolution. Replies follow the language of your question, not the documentation default. Please redact subscription URLs, credentials and private logs. See docs/ai-issue-responder.md for the current workflow."
      }
    },
    {
      "type": "dropdown",
      "id": "kind",
      "attributes": {
        "label": "Request type",
        "options": [
          "Rule source / coverage",
          "Service or regional group",
          "Existing rule target",
          "Client or core support",
          "DNS / sniffer / fake-IP policy",
          "Other improvement"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "what",
      "attributes": {
        "label": "Proposed change",
        "description": "Provide precise domains, source URLs, behavior and affected clients."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "why",
      "attributes": {
        "label": "Why it is needed",
        "description": "Explain the coverage gap or reproducible limitation. Include evidence rather than assumptions about a region or service."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "alternatives",
      "attributes": {
        "label": "Existing alternatives",
        "description": "Could an existing rule source or configuration option satisfy the need? Explain trade-offs."
      }
    }
  ]
}
