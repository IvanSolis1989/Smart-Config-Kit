{
  "name": "Documentation (English)",
  "description": "Report outdated steps, ambiguous text or broken documentation links.",
  "title": "[Docs] ",
  "labels": [
    "documentation"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Automated analysis may assist with triage or propose a fix, but it is not a guarantee of correctness or resolution. Replies follow the language of your question, not the documentation default. Please redact subscription URLs, credentials and private logs. See docs/ai-issue-responder.md for the current workflow."
      }
    },
    {
      "type": "input",
      "id": "location",
      "attributes": {
        "label": "Document location",
        "description": "Link to the file, section or lines."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "issue",
      "attributes": {
        "label": "Problem description",
        "description": "Explain what is incorrect or unclear and cite the observed behavior or source."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "suggest",
      "attributes": {
        "label": "Suggested correction",
        "description": "Optional wording or links to authoritative references."
      }
    }
  ]
}
