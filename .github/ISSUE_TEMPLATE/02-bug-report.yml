{
  "name": "Bug report (English)",
  "description": "Configuration, script, asset or cross-client consistency defects.",
  "title": "[Bug] ",
  "labels": [
    "bug"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Automated analysis may assist with triage or propose a fix, but it is not a guarantee of correctness or resolution. Replies follow the language of your question, not the documentation default. Please redact subscription URLs, credentials and private logs. See docs/ai-issue-responder.md for the current workflow."
      }
    },
    {
      "type": "dropdown",
      "id": "product",
      "attributes": {
        "label": "Affected artifact",
        "description": "Select the configuration or client affected.",
        "options": [
          "Clash Party / Clash Verge Rev (Smart / Normal JS)",
          "CMFA / ClashMi",
          "OpenClash (OpenWrt)",
          "FlClash",
          "Shadowrocket (iOS)",
          "Surge (iOS / macOS)",
          "Loon (iOS)",
          "Quantumult X (iOS)",
          "sing-box / Hiddify / HomeProxy",
          "Karing",
          "v2rayN",
          "Passwall / Passwall2",
          "Meow / AEROVE Lite",
          "Other / unsure",
          "Multiple clients / shared artifacts",
          "Documentation / changelog / maintenance contract"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Artifact version",
        "description": "Read the file header or changelog."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "bug",
      "attributes": {
        "label": "Bug description",
        "description": "Describe the actual and expected behavior, with evidence."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reproduce",
      "attributes": {
        "label": "Steps to reproduce",
        "description": "Give repeatable steps, client/core versions and the configuration entry point."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "logs",
      "attributes": {
        "label": "Redacted error logs",
        "description": "Include the relevant stack or parser output in a fenced code block."
      }
    },
    {
      "type": "checkboxes",
      "id": "precheck",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I searched existing issues and checked the current artifact version.",
            "required": true
          },
          {
            "label": "I removed subscription URLs and credentials from this report.",
            "required": true
          }
        ]
      }
    }
  ]
}
