{
  "name": "Question / help (English)",
  "description": "Import, DNS, rule matching or client usage questions.",
  "title": "[Question] ",
  "labels": [
    "question"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Automated analysis may assist with triage or propose a fix, but it is not a guarantee of correctness or resolution. Replies follow the language of your question, not the documentation default. Please redact subscription URLs, credentials and private logs. See docs/ai-issue-responder.md for the current workflow."
      }
    },
    {
      "type": "dropdown",
      "id": "client",
      "attributes": {
        "label": "Client",
        "description": "Which client and platform are affected?",
        "options": [
          "Clash Party / Clash Verge Rev (Smart / Normal JS)",
          "CMFA / ClashMi",
          "OpenClash (OpenWrt)",
          "FlClash",
          "Shadowrocket (iOS)",
          "Surge (iOS / macOS)",
          "Loon (iOS)",
          "Quantumult X (iOS)",
          "sing-box / Hiddify / HomeProxy",
          "Karing",
          "v2rayN",
          "Passwall / Passwall2",
          "Meow / AEROVE Lite",
          "Other / unsure"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Client version",
        "description": "Include the actual core version where available."
      }
    },
    {
      "type": "input",
      "id": "config_version",
      "attributes": {
        "label": "Configuration version",
        "description": "Use the file header or the matching changelog."
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Problem description",
        "description": "What are you trying to do, and what actually happens? Include relevant steps."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Expected behavior",
        "description": "Describe the expected routing or import result."
      }
    },
    {
      "type": "textarea",
      "id": "logs",
      "attributes": {
        "label": "Logs / screenshots / errors",
        "description": "Share only redacted diagnostics; put logs in fenced code blocks."
      }
    },
    {
      "type": "checkboxes",
      "id": "precheck",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I checked the matching client guide and its version/import limitations.",
            "required": true
          },
          {
            "label": "I removed subscription URLs and credentials from this report.",
            "required": true
          }
        ]
      }
    }
  ]
}
