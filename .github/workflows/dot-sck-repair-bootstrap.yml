name: SCK reliability branch verification
on:
  push:
    branches: [dot/sck-reliability-20261109]
permissions: {}
concurrency:
  group: dot-sck-repairs-20261109
  cancel-in-progress: false
jobs:
  verify-and-generate:
    if: github.repository == 'IvanSolis1989/Smart-Config-Kit' && github.ref == 'refs/heads/dot/sck-reliability-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3'
      - uses: ./.github/actions/setup-aerove-mihomo
      - name: Verify branch baseline and generate exact reviewed output
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/dot/sck-reliability-20261109 | cut -f1)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = d0310d2e58fa47102b1595a5af58c50dfb188d49
          git merge-base --is-ancestor d0310d2e58fa47102b1595a5af58c50dfb188d49 HEAD
          test -z "$(git status --porcelain)"
          node tools/refresh-rule-quality.js
          node tools/generate-karing.js
          MIHOMO_BIN="$AEROVE_MIHOMO_BIN" node tools/generate-aerove-rule-assets.js
          node tools/generate-meow.js
          node tools/generate-configuration-form.js
          cat > "$RUNNER_TEMP/sck-expected.sha256" <<'HASHES'
          696b027de4cb5dbcb283992d42716ab7b965098b4f1a8d6a11a3d23fb677bddb  Meow内核系/Aerove Lite/rule-assets/manifest.json
          db16f2e035094758fbb25f0ffd24c59c9676d3ef77d92455f29d8bf73c7bb8a3  Meow内核系/adapter-manifest.json
          8d321f16c7d98ba76e1cba8f07d0fc990fc7add29019b6bf2c0f804284155eab  Sing-box内核系/Karing/adapter-manifest.json
          44ff5472ee72438c3874ecc6b934beb6103c2b6b5c45826e975141b5384be956  docs/configuration.html
          b4ced6cd147588a53ee525221f0bd6e0eb9d98d915f92a3f8f9939e2ed1d421d  rulesets/generated/fused/manifest.json
          0017c63d2611571539a51a23dd1b36c4a0caca1f1f36fd15cedf6207cb36f073  rulesets/generated/source-ledger.json
          HASHES
          sha256sum -c "$RUNNER_TEMP/sck-expected.sha256"
          node tools/generate-configuration-form.js --check
          node tools/generate-karing.js --check
          node tools/refresh-rule-quality.js --check
          node tools/generate-meow.js --check
          MIHOMO_BIN="$AEROVE_MIHOMO_BIN" node tools/generate-aerove-rule-assets.js --check
          node tools/validate-artifact-contracts.js --strict-ruby
          node --test tools/tests/configuration-form.test.js tools/tests/configuration-pages.test.js tools/tests/release-batch.test.js tools/tests/karing*.test.js tools/tests/ai-issue-*.test.js tools/tests/ai-responder-workflow.test.js tools/tests/local-codex-*.test.js tools/tests/fused-rule-optimizer.test.js tools/tests/source-provenance.test.js
          node tools/build-configuration-pages.js --output-dir .cache/configuration-pages --commit "$GITHUB_SHA"
      - name: Render desktop light, dark, and 390px review evidence
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/sck-review" --no-save --package-lock=false playwright@1.56.1 marked@16.4.1
          "$RUNNER_TEMP/sck-review/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/sck-review/node_modules" node tools/ci/review-sck-pages.cjs
      - name: Save rendered review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sck-repair-visual-review
          path: .cache/sck-review/*.png
          retention-days: 7
      - name: Commit only the six hash-verified generated receipts and form with branch lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = d0310d2e58fa47102b1595a5af58c50dfb188d49
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/dot/sck-reliability-20261109 | cut -f1)"
          git diff --name-only -z | python3 -c 'import sys,json; actual=set(sys.stdin.buffer.read().decode().strip("\0").split("\0")); assert actual==set(json.loads(sys.argv[1])), actual' '["Meow内核系/Aerove Lite/rule-assets/manifest.json", "Meow内核系/adapter-manifest.json", "Sing-box内核系/Karing/adapter-manifest.json", "docs/configuration.html", "rulesets/generated/fused/manifest.json", "rulesets/generated/source-ledger.json"]'
          test -z "$(git ls-files --others --exclude-standard)"
          sha256sum -c "$RUNNER_TEMP/sck-expected.sha256"
          git add -- 'Meow内核系/Aerove Lite/rule-assets/manifest.json' 'Meow内核系/adapter-manifest.json' 'Sing-box内核系/Karing/adapter-manifest.json' 'docs/configuration.html' 'rulesets/generated/fused/manifest.json' 'rulesets/generated/source-ledger.json'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[agent: iCEO] build: refresh bound provenance and configuration form'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --force-with-lease="refs/heads/dot/sck-reliability-20261109:$GITHUB_SHA" origin HEAD:refs/heads/dot/sck-reliability-20261109
