name: SCK repair branch verification
on:
  push:
    branches: [dot/sck-repairs-20261109]
permissions: {}
concurrency:
  group: dot-sck-repairs-20261109
  cancel-in-progress: false
jobs:
  verify-and-generate:
    if: github.repository == 'IvanSolis1989/Smart-Config-Kit' && github.ref == 'refs/heads/dot/sck-repairs-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3'
      - name: Verify branch baseline and generate exact reviewed output
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/dot/sck-repairs-20261109 | cut -f1)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 7349656fb5021db0f37a61a2ef1b9d1c0c755abd
          git merge-base --is-ancestor 7349656fb5021db0f37a61a2ef1b9d1c0c755abd HEAD
          test -z "$(git status --porcelain)"
          node tools/generate-configuration-form.js
          echo '98911f9301f5e6bade7cbc757cc194d3ac204acd614990b16277c41b8718854e  docs/configuration.html' | sha256sum -c -
          node tools/generate-configuration-form.js --check
          node tools/generate-karing.js --check
          node tools/validate-artifact-contracts.js --strict-ruby
          node --test tools/tests/configuration-form.test.js tools/tests/configuration-pages.test.js tools/tests/release-batch.test.js tools/tests/karing*.test.js tools/tests/ai-issue-*.test.js tools/tests/ai-responder-workflow.test.js tools/tests/local-codex-*.test.js
          node tools/build-configuration-pages.js --output-dir .cache/configuration-pages --commit "$GITHUB_SHA"
      - name: Render desktop light, dark, and 390px review evidence
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/sck-review" --no-save --package-lock=false playwright@1.56.1 marked@16.4.1
          "$RUNNER_TEMP/sck-review/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/sck-review/node_modules" node tools/ci/review-sck-pages.cjs
      - name: Save rendered review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sck-repair-visual-review
          path: .cache/sck-review/*.png
          retention-days: 7
      - name: Commit only the hash-verified generated form with branch lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 7349656fb5021db0f37a61a2ef1b9d1c0c755abd
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/dot/sck-repairs-20261109 | cut -f1)"
          test "$(git diff --name-only)" = docs/configuration.html
          test -z "$(git ls-files --others --exclude-standard)"
          echo '98911f9301f5e6bade7cbc757cc194d3ac204acd614990b16277c41b8718854e  docs/configuration.html' | sha256sum -c -
          git add -- docs/configuration.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[agent: iCEO] build: regenerate verified configuration form v1.4.4'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --force-with-lease="refs/heads/dot/sck-repairs-20261109:$GITHUB_SHA" origin HEAD:refs/heads/dot/sck-repairs-20261109
