name: Deploy Configuration Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Serialize main deployments without allowing a skipped non-main dispatch to
# replace a queued main run. In-progress deployments complete before the next.
concurrency:
  group: configuration-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject a superseded main commit
        shell: bash
        run: test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Ruby for native configuration checks
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'

      - name: Test Pages packaging boundary
        run: node --test tools/tests/configuration-pages.test.js

      - name: Verify saved form and build minimal Pages artifact
        run: node tools/build-configuration-pages.js --output-dir .cache/configuration-pages --commit "$GITHUB_SHA"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .cache/configuration-pages
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy configuration form
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
