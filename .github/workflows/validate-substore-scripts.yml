name: Validate Sub-Store Scripts

on:
  pull_request:
    paths:
      - 'SubStore/**/*.js'
      - 'SubStore/**/*.mjs'
      - 'SubStore/edge-extension/**'
      - 'tools/tests/fusion-publication-guard.test.js'
      - 'tools/tests/fusion-worker-patch.test.js'
      - 'tools/tests/extension-sync-route.test.js'
      - '.github/workflows/validate-substore-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'SubStore/**/*.js'
      - 'SubStore/**/*.mjs'
      - 'SubStore/edge-extension/**'
      - 'tools/tests/fusion-publication-guard.test.js'
      - 'tools/tests/fusion-worker-patch.test.js'
      - 'tools/tests/extension-sync-route.test.js'
      - '.github/workflows/validate-substore-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate mirror traffic aggregation
        run: |
          node --check SubStore/scripts/local/merge-subscription-userinfo.js
          node --test SubStore/scripts/local/merge-subscription-userinfo.test.js
      - name: Validate browser link sync
        run: |
          node SubStore/edge-extension/build.mjs --check
          node --test SubStore/edge-extension/*.test.mjs SubStore/edge-extension/*.test.cjs
      - name: Validate publication completeness and extension API
        run: |
          node --check SubStore/scripts/fusion-publication-guard.mjs
          node --check SubStore/scripts/patch-fusion-worker.mjs
          node --check SubStore/scripts/extension-sync-route.mjs
          node --check SubStore/scripts/patch-extension-sync-worker.mjs
          node --test tools/tests/fusion-publication-guard.test.js tools/tests/fusion-worker-patch.test.js tools/tests/extension-sync-route.test.js

  browser-e2e:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned browser harness
        run: npm install --ignore-scripts --no-save --no-package-lock playwright@1.62.1
      - name: Verify automatic browser flow in an isolated profile
        env:
          BROWSER_EXECUTABLE: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
        run: |
          node SubStore/edge-extension/build.mjs --check
          node SubStore/edge-extension/browser-e2e.mjs
