name: AI Issue Auto-Responder (Xiaomi MiMo)

# ═══════════════════════════════════════════════════════════════════════════
# Smart-Config-Kit — AI Issue 自动回复器
# ───────────────────────────────────────────────────────────────────────────
# 触发方式（二选一）：
#   1. Issue 被打上（或创建时自带）任一标签：
#        question / faq / help wanted / bug / enhancement / documentation
#      —— 对应 .github/ISSUE_TEMPLATE 里 4 个模板各自的 labels 字段
#   2. 仓库维护者/协作者在 issue 评论区写 "/ai-help"
#
# 分层调用策略（Xiaomi MiMo 双模型 + 代码修改权限）：
#   ┌──────────────────────┬───────────────┬──────────┬──────────┬──────────┐
#   │ Issue 类别            │ 触发场景       │ 模型     │ Thinking │ 代码修改 │
#   ├──────────────────────┼───────────────┼──────────┼──────────┼──────────┤
#   │ question/faq/        │ 首次（labeled）│ mimo-v2.6-flash │ enabled  │ ❌       │
#   │   help wanted        │ 第1次+ /ai-help│ mimo-v2.6-pro   │ enabled  │ ❌       │
#   ├──────────────────────┼───────────────┼──────────┼──────────┼──────────┤
#   │ bug                  │ 首次（labeled）│ mimo-v2.6-flash │ enabled  │ ✅       │
#   │                      │ /ai-help 追问  │ mimo-v2.6-pro   │ enabled  │ ✅       │
#   ├──────────────────────┼───────────────┼──────────┼──────────┼──────────┤
#   │ enhancement          │ 首次（labeled）│ mimo-v2.6-flash │ enabled  │ ✅       │
#   │                      │ /ai-help 追问  │ mimo-v2.6-pro   │ enabled  │ ✅       │
#   ├──────────────────────┼───────────────┼──────────┼──────────┼──────────┤
#   │ documentation        │ 首次（labeled）│ mimo-v2.6-flash │ enabled  │ ✅ (文档) │
#   │                      │ /ai-help 追问  │ mimo-v2.6-pro   │ enabled  │ ✅ (文档) │
#   └──────────────────────┴───────────────┴──────────┴──────────┴──────────┘
#
#   代码修改模式：AI 输出结构化响应（<!-- AI_REPLY --> + <!-- AI_PATCH --> +
#   <!-- AI_PR -->），workflow 自动提取补丁、创建分支、提交并开 PR。
#   不按格式输出 → fallback 只发评论，不创建 PR。
#
# 安全护栏：
#   • permissions 给 issues:write + contents:write + pull-requests:write
#   • system prompt 区分「只分析」和「可改代码」两种模式
#   • 不改代码的模式下仍禁止 diff/patch
#   • 内容过滤 / 拒答 / 截断均禁止补丁；仅传输或限流故障有限重试
#   • 上下文按问题选取，完整文件清单之外的文件禁止重写
#   • timeout 15 分钟硬上限
#
# 需要配置的 secret / variable：
#   Settings → Secrets and variables → Actions
#     Secret:   MIMO_API_KEY
#     Value:    Xiaomi MiMo 控制台生成的 API key（标准或 Token Plan，不能混用）
#     Variable: MIMO_BASE_URL（可选；当前默认 Token Plan 中国端点，标准 key 须显式配置标准端点）
#     Secret:   TAVILY_API_KEY
#     Value: https://app.tavily.com/home 生成（免费 1000 次/月；可选，不配则跳过联网搜索）
# ═══════════════════════════════════════════════════════════════════════════

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: ai-responder-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    if: |
      (github.event_name == 'issues' && (
        github.event.label.name == 'question' ||
        github.event.label.name == 'faq' ||
        github.event.label.name == 'help wanted' ||
        github.event.label.name == 'bug' ||
        github.event.label.name == 'enhancement' ||
        github.event.label.name == 'documentation'
      )) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/ai-help') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        ))

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 步骤 1：判定 issue 类别 + 选择模型 / thinking / 代码修改权限 ─
      - name: Determine category & model
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
        run: |
          # ── 1. 判定 issue 类别 ─────────────────────────────────
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            CATEGORY="$LABEL_NAME"
            # 把 faq / help wanted 归入 question 类
            case "$CATEGORY" in
              faq|"help wanted") CATEGORY="question" ;;
            esac
          else
            # issue_comment 事件：查 issue 的 labels
            ISSUE_LABELS=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq '.labels[].name' 2>/dev/null || echo "")
            if echo "$ISSUE_LABELS" | grep -qx 'bug'; then
              CATEGORY="bug"
            elif echo "$ISSUE_LABELS" | grep -qx 'enhancement'; then
              CATEGORY="enhancement"
            elif echo "$ISSUE_LABELS" | grep -qx 'documentation'; then
              CATEGORY="documentation"
            else
              CATEGORY="question"  # question / faq / help wanted / 无标签默认
            fi
          fi

          # ── 2. 计数 /ai-help 次数 ─────────────────────────────
          AI_HELP_COUNT=0
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            AI_HELP_COUNT=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
              --jq '[.[] | select(.body | contains("/ai-help"))] | length' 2>/dev/null || echo "1")
          fi

          # ── 3. 查表决策 ──────────────────────────────────────
          case "$CATEGORY" in
            question)
              if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
                MODEL="mimo-v2.6-pro"
                TIER_MARK="FOLLOWUP"
                TIER_LABEL="问题追问（mimo-v2.6-pro 思考 · 只分析）"
              else
                MODEL="mimo-v2.6-flash"
                TIER_MARK="FIRST"
                TIER_LABEL="问题/求助（首轮 · mimo-v2.6-flash 思考 · 只分析）"
              fi
              THINKING_TYPE="enabled"
              CODE_MOD="false"
              ;;
            bug)
              if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
                MODEL="mimo-v2.6-pro"
                TIER_MARK="FOLLOWUP"
                TIER_LABEL="Bug 追问（mimo-v2.6-pro 思考 · 可改代码）"
              else
                MODEL="mimo-v2.6-flash"
                TIER_MARK="FIRST"
                TIER_LABEL="Bug 分析（首轮 · mimo-v2.6-flash 思考 · 可改代码）"
              fi
              THINKING_TYPE="enabled"
              CODE_MOD="true"
              ;;
            enhancement)
              if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
                MODEL="mimo-v2.6-pro"
                TIER_MARK="FOLLOWUP"
                TIER_LABEL="功能建议追问（mimo-v2.6-pro 思考 · 可改代码）"
              else
                MODEL="mimo-v2.6-flash"
                TIER_MARK="FIRST"
                TIER_LABEL="功能建议（首轮 · mimo-v2.6-flash 思考 · 可改代码）"
              fi
              THINKING_TYPE="enabled"
              CODE_MOD="true"
              ;;
            documentation)
              THINKING_TYPE="enabled"
              CODE_MOD="true"
              if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
                MODEL="mimo-v2.6-pro"
                TIER_MARK="FOLLOWUP"
                TIER_LABEL="文档追问（mimo-v2.6-pro 思考 · 可改文档）"
              else
                MODEL="mimo-v2.6-flash"
                TIER_MARK="FIRST"
                TIER_LABEL="文档反馈（首轮 · mimo-v2.6-flash 思考 · 可改文档）"
              fi
              ;;
          esac

          CURL_TIMEOUT=240  # 思考模式统一 240s；非思考 60s
          if [ "$THINKING_TYPE" = "disabled" ]; then
            CURL_TIMEOUT=60
          fi

          echo "🎯 Category: ${CATEGORY} / Tier: ${TIER_LABEL} / Model: ${MODEL} / Thinking: ${THINKING_TYPE} / CodeMod: ${CODE_MOD}"
          echo "category=${CATEGORY}"           >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}"                 >> "$GITHUB_OUTPUT"
          echo "thinking=${THINKING_TYPE}"      >> "$GITHUB_OUTPUT"
          echo "code_mod=${CODE_MOD}"           >> "$GITHUB_OUTPUT"
          echo "tier_mark=${TIER_MARK}"         >> "$GITHUB_OUTPUT"
          echo "tier_label=${TIER_LABEL}"       >> "$GITHUB_OUTPUT"
          echo "curl_timeout=${CURL_TIMEOUT}"   >> "$GITHUB_OUTPUT"
          echo "ai_help_count=${AI_HELP_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Build bounded AI context
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          CODE_MOD: ${{ steps.tier.outputs.code_mod }}
        run: node tools/build-ai-issue-context.js --output /tmp/context.txt
      # ── 步骤 2.5：Tavily 联网搜索 ──────────────────────────
      - name: Search web for context (Tavily)
        if: steps.tier.outputs.category != 'documentation'
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          CATEGORY: ${{ steps.tier.outputs.category }}
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "⚠️ TAVILY_API_KEY 未配置，跳过联网搜索"
            echo "tavily_results=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── 构造搜索查询 ──────────────────────────────────
          # D11-06: 净化 ISSUE_BODY（截断 + 脱敏）再送入 Tavily
          BODY_SANITIZED=$(echo "${ISSUE_BODY}" | head -c 100 | sed -E 's/(sk-[a-zA-Z0-9]{20,})/[REDACTED]/g; s/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[IP]/g')
          # 以 issue 标题为主，取净化正文前 300 字符辅助
          QUERY="${ISSUE_TITLE}"
          BODY_PREFIX=$(echo "${BODY_SANITIZED}" | head -c 300 | tr '\n' ' ' | tr -s ' ')
          if [ ${#BODY_PREFIX} -gt 20 ]; then
            QUERY="${QUERY} - ${BODY_PREFIX}"
          fi
          # 按类别追加领域上下文关键词
          case "$CATEGORY" in
            bug)         QUERY="${QUERY} mihomo clash configuration issue" ;;
            enhancement) QUERY="${QUERY} clash mihomo rule-set proxy-groups" ;;
            question)    QUERY="${QUERY} clash mihomo setup guide" ;;
          esac

          echo "🔍 Tavily search requested (query omitted from logs)"

          RESPONSE=$(curl -s --max-time 15 https://api.tavily.com/search \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg q "$QUERY" \
              --arg key "$TAVILY_API_KEY" \
              '{api_key: $key, query: $q, search_depth: "basic", max_results: 5, topic: "general"}')") || true

          # ── 格式化追加到 context ──────────────────────────
          {
            echo ""
            echo "===== 联网搜索结果（Tavily）====="
            echo "$RESPONSE" | jq -r '.results[] | "来源: \(.url)\n标题: \(.title)\n内容: \(.content[:1000])\n---"' 2>/dev/null || echo "(搜索无结果或 Tavily 调用出错)"
          } >> /tmp/context.txt

          RESULTS_COUNT=$(echo "$RESPONSE" | jq '.results | length' 2>/dev/null || echo "0")
          echo "✅ Tavily done: ${RESULTS_COUNT} results"
          echo "tavily_results=${RESULTS_COUNT}" >> "$GITHUB_OUTPUT"

      # ── 步骤 2：调用 Xiaomi MiMo API ─────────────────────────
      - name: Call Xiaomi MiMo API
        id: llm
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          # 优先使用配置项；兼容误建为 Secret 的 Base URL，最终回退到 Token Plan 中国端点。
          MIMO_BASE_URL: ${{ vars.MIMO_BASE_URL || secrets.MIMO_BASE_URL || 'https://token-plan-cn.xiaomimimo.com/v1' }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          MODEL: ${{ steps.tier.outputs.model }}
          THINKING: ${{ steps.tier.outputs.thinking }}
          CODE_MOD: ${{ steps.tier.outputs.code_mod }}
          TIER_MARK: ${{ steps.tier.outputs.tier_mark }}
          CURL_TIMEOUT: ${{ steps.tier.outputs.curl_timeout }}
          CATEGORY: ${{ steps.tier.outputs.category }}
          AI_HELP_COUNT: ${{ steps.tier.outputs.ai_help_count }}
        run: node tools/respond-ai-issue.js

      # ── 步骤 3：提取代码修改 + 创建 PR ─────────────────────
      - name: Apply code changes & create PR
        id: pr
        if: steps.llm.outputs.status == 'ok' && steps.tier.outputs.code_mod == 'true' && steps.llm.outputs.has_patch == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔧 代码修改模式已激活，提取补丁..."

          # ── 配置 git 身份 ────────────────────────────────
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ── 生成分支名 ────────────────────────────────────
          BRANCH="ai-fix/issue-${ISSUE_NUMBER}-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"

          # ── 提取并应用 AI_PATCH 块 ────────────────────────
          # 格式：<!-- AI_PATCH:path/to/file --> ... <!-- /AI_PATCH -->
          PATCH_COUNT=0

          # 用 Python 提取每个 patch 块，并在写入前验证路径仍在仓库内。
          python3 <<'PY' | tee /tmp/patch_apply.log
          import json
          import re
          import sys
          import os
          from pathlib import Path

          # 白名单：仅允许写入这些目录/文件前缀（D11-01）
          ALLOWED_PREFIXES = [
              'Clash Party/', 'Clash Meta For Android/', 'OpenClash/',
              'Shadowrocket/', 'Stash/', 'SingBox/', 'v2rayN/', 'Surge/', 'Loon/',
              'Quantumult X/', 'Passwall/', 'Passwall2/', 'FlClash/',
              'CHANGELOG.md', 'README.md', 'docs/', 'tools/'
          ]

          root = Path.cwd().resolve()
          text = Path('/tmp/ai_response.txt').read_text(encoding='utf-8')
          pattern = re.compile(r'<!--\s*AI_PATCH:([^>\n]+?)\s*-->\s*\n(.*?)\n?<!--\s*/AI_PATCH\s*-->', re.S)
          result = json.loads(Path('/tmp/ai-result.json').read_text(encoding='utf-8'))
          if result.get('status') != 'ok' or not result.get('hasPatch'):
              raise SystemExit('No complete, accepted AI patch response')
          patchable = set(result.get('patchableFiles', []))
          patches = pattern.findall(text)
          if not patches:
              print('PATCH_COUNT=0')
              sys.exit(0)
          if any(raw_path.strip() not in patchable for raw_path, _ in patches):
              print('Skipped patch set: at least one file was not supplied in full')
              print('PATCH_COUNT=0')
              sys.exit(0)

          count = 0
          modified_files = []

          for raw_path, content in patches:
              rel = raw_path.strip()
              if not rel or rel.startswith(('/', '\\', '~')) or '\\' in rel:
                  print(f'  ⚠️ Skipped (invalid path): {rel}')
                  continue
              rel_path = Path(rel)
              if '..' in rel_path.parts or '.git' in rel_path.parts:
                  print(f'  ⚠️ Skipped (path traversal): {rel}')
                  continue
              target = (root / rel_path).resolve()
              try:
                  target.relative_to(root)
              except ValueError:
                  print(f'  ⚠️ Skipped (escapes repo): {rel}')
                  continue

              # ── 白名单检查 ──────────────────────────────────────
              abs_target = os.path.abspath(target)
              rel_norm = os.path.relpath(abs_target, root).replace('\\', '/')
              allowed = False
              for prefix in ALLOWED_PREFIXES:
                  if rel_norm == prefix or rel_norm.startswith(prefix):
                      allowed = True
                      break
              if not allowed:
                  print(f'  ⚠️ Skipped (not in allowed prefixes): {rel}')
                  continue

              target.parent.mkdir(parents=True, exist_ok=True)
              normalized = content.rstrip('\n') + '\n'
              target.write_text(normalized, encoding='utf-8')
              line_count = 0 if not content else content.rstrip('\n').count('\n') + 1
              print(f'  ✅ Wrote: {rel} ({line_count} lines)')
              modified_files.append(rel)
              count += 1

          # ── 写出修改文件列表供 bash 步骤精确 git add ──────────
          if modified_files:
              Path('/tmp/modified_files.txt').write_text(
                  '\n'.join(modified_files) + '\n', encoding='utf-8')
          else:
              Path('/tmp/modified_files.txt').write_text('', encoding='utf-8')

          print(f'PATCH_COUNT={count}')
          PY

          PATCH_COUNT=$(sed -n 's/^PATCH_COUNT=//p' /tmp/patch_apply.log | tail -1)
          PATCH_COUNT="${PATCH_COUNT:-0}"

          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "⚠️ 未能解析任何 AI_PATCH 块，跳过 PR 创建"
            git checkout - 2>/dev/null || true
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "📦 共 $PATCH_COUNT 个文件已修改"

          # ── 提取 PR 标题和正文 ────────────────────────────
          # <!-- AI_PR --> 内部格式：第一行是标题，| 之后是正文
          awk '
            /<!-- AI_PR -->/ { in_pr=1; next }
            /<!-- \/AI_PR -->/ { in_pr=0; next }
            in_pr { print }
          ' /tmp/ai_response.txt > /tmp/pr_raw.txt

          if [ -s /tmp/pr_raw.txt ]; then
            PR_TITLE=$(head -1 /tmp/pr_raw.txt | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            # 去掉标题行首的 | 分隔符（如果有）
            PR_TITLE=$(echo "$PR_TITLE" | sed 's/^|\s*//')
            # 正文从第 2 行开始（跳过 | 行如果有的话）
            PR_BODY=$(tail -n +2 /tmp/pr_raw.txt | sed 's/^|\s*//')
            # 追加自动标记
            PR_BODY="${PR_BODY}

          ---
          <sub>🤖 此 PR 由 AI 自动生成（issue #${ISSUE_NUMBER}）· Workflow: \`.github/workflows/ai-responder.yml\` · 请维护者审查后合并</sub>"
          else
            PR_TITLE="ai-fix: issue #${ISSUE_NUMBER} 自动修复"
            PR_BODY="🤖 此 PR 由 AI 基于 issue #${ISSUE_NUMBER} 自动生成，请审查后合并。"
          fi

          # 清理标题（去特殊字符，限长）
          PR_TITLE=$(echo "$PR_TITLE" | head -1 | cut -c1-72)
          echo "📝 PR 标题: $PR_TITLE"

          # ── 提交并推送 ────────────────────────────────────
          # D11-03: 精确暂存，仅添加 AI_PATCH 实际写入的文件
          if [ -s /tmp/modified_files.txt ]; then
            while IFS= read -r file; do
              git add -- "$file"
            done < /tmp/modified_files.txt
          else
            echo "⚠️ modified_files.txt 为空，跳过 git add"
          fi
          git commit -m "$PR_TITLE" || { echo "⚠️ 没有变更需要提交"; git checkout - 2>/dev/null || true; echo "pr_url=" >> "$GITHUB_OUTPUT"; exit 0; }
          git push origin "$BRANCH" 2>&1 || { echo "⚠️ Push 失败"; git checkout - 2>/dev/null || true; echo "pr_url=" >> "$GITHUB_OUTPUT"; exit 0; }

          # ── 创建 PR ────────────────────────────────────────
          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" \
            2>&1) || { echo "⚠️ PR 创建失败: $PR_URL"; echo "pr_url=" >> "$GITHUB_OUTPUT"; exit 0; }

          echo "🔗 PR created: $PR_URL"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "patch_count=${PATCH_COUNT}" >> "$GITHUB_OUTPUT"

      # ── 步骤 4：发布回复评论 ──────────────────────────────
      - name: Post reply to issue
        if: steps.llm.outputs.skipped != 'true'
        uses: actions/github-script@v7
        env:
          AI_MODEL: ${{ steps.tier.outputs.model }}
          AI_TIER: ${{ steps.tier.outputs.tier_label }}
          CODE_MOD: ${{ steps.tier.outputs.code_mod }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        with:
          script: |
            const result = JSON.parse(require('fs').readFileSync('/tmp/ai-result.json', 'utf8'));
            const aiReply = result.reply;
            const model   = process.env.AI_MODEL || 'mimo-v2.6-flash';
            const codeMod = result.codeModAllowed ? 'true' : 'false';
            const configuredTier = process.env.AI_TIER || 'AI 自动回复';
            const tier = codeMod === 'true' ? configuredTier : configuredTier.replace(/可改代码|可改文档/g, '只分析');
            const prUrl   = process.env.PR_URL   || '';

            // ── 构建 footer ──────────────────────────────────
            const footerLines = [
              '---',
            ];
            if (result.status !== 'ok') {
              footerLines.push(`<sub>Model: ${model} · Status: ${result.status} · 本次分析未完成，等待维护者人工处理</sub>`);
            } else if (prUrl) {
              footerLines.push(
                `<sub>Model: \`${model}\` · Tier: ${tier} · 🔗 PR: ${prUrl} · Workflow: \`.github/workflows/ai-responder.yml\` · 想要更深度分析请在评论里 \`/ai-help\` · AI 自动生成，最终处理请等维护者 @ivansolis1989</sub>`
              );
            } else if (codeMod === 'true') {
              footerLines.push(
                `<sub>Model: \`${model}\` · Tier: ${tier}（含代码修改权限，但本次未触发修改） · Workflow: \`.github/workflows/ai-responder.yml\` · 想要更深度分析请在评论里 \`/ai-help\` · AI 自动生成，最终处理请等维护者 @ivansolis1989</sub>`
              );
            } else {
              footerLines.push(
                `<sub>Model: \`${model}\` · Tier: ${tier} · Workflow: \`.github/workflows/ai-responder.yml\` · 想要更深度分析请在评论里 \`/ai-help\` · AI 无代码修改权限，最终处理请等维护者 @ivansolis1989</sub>`
              );
            }

            const commentBody = [
              `> 🤖 **AI 自动回复**（${tier}，仅供参考）`,
              '',
              aiReply,
              ...footerLines,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Notify missing secret
        if: steps.llm.outputs.skipped == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = [
              '> ⚠️ AI 助手未就绪',
              '',
              '仓库维护者需要先在 Settings → Secrets and variables → Actions 里配置 `MIMO_API_KEY`（可选变量 `MIMO_BASE_URL`；Token Plan 请填控制台提供的完整 base URL），此 issue 将等人工回复。',
              '',
              '<sub>Workflow: `.github/workflows/ai-responder.yml`</sub>'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Mark incomplete AI analysis
        if: steps.llm.outputs.status != '' && steps.llm.outputs.status != 'ok'
        run: |
          echo '::error::MiMo analysis did not complete. See the provider status in the job summary; no patch was applied.'
          exit 1
