name: Validate JS Overwrites

on:
  pull_request:
    paths:
      - 'Mihomo内核系/Clash Party/**/*.js'
      - 'Mihomo内核系/FlClash/**/*.js'
      - 'rulesets/source/routing-graph.js'
      - 'rulesets/source/traffic-options.json'
      - 'tools/runtime/**'
      - 'tools/configure-traffic-options.js'
      - 'tools/sync-traffic-options.js'
      - 'tools/lib/local-traffic-options.js'
      - 'tools/lib/configuration-schema.js'
      - 'tools/configure.js'
      - 'tools/tests/configuration-options.test.js'
      - 'tools/tests/local-traffic-options.test.js'
      - 'tools/lib/write-repository-artifact.js'
      - 'tools/tests/traffic-options.test.js'
      - 'tools/tests/zerotier-planet-proxy.test.js'
      - 'tools/lib/subscription-adapter-profiles.js'
      - 'tools/sync-node-dns-hints-adapters.js'
      - 'tools/sync-subscription-node-filter.js'
      - 'tools/tests/subscription-node-filter.test.js'
      - 'tools/validate-js-overwrites.js'
      - 'tools/validate-js-engines.js'
      - 'tools/lib/js-engine-fixtures.js'
      - 'tools/tests/js-engines.test.js'
      - 'tools/js-engine-tests/**'
      - 'tools/generate-readme-visuals.js'
      - 'docs/assets/readme/**'
      - 'README.md'
      - '.github/workflows/validate-js-overwrites.yml'
  push:
    branches: [main]
    paths:
      - 'Mihomo内核系/Clash Party/**/*.js'
      - 'Mihomo内核系/FlClash/**/*.js'
      - 'rulesets/source/routing-graph.js'
      - 'rulesets/source/traffic-options.json'
      - 'tools/runtime/**'
      - 'tools/configure-traffic-options.js'
      - 'tools/sync-traffic-options.js'
      - 'tools/lib/local-traffic-options.js'
      - 'tools/lib/configuration-schema.js'
      - 'tools/configure.js'
      - 'tools/tests/configuration-options.test.js'
      - 'tools/tests/local-traffic-options.test.js'
      - 'tools/lib/write-repository-artifact.js'
      - 'tools/tests/traffic-options.test.js'
      - 'tools/tests/zerotier-planet-proxy.test.js'
      - 'tools/lib/subscription-adapter-profiles.js'
      - 'tools/sync-node-dns-hints-adapters.js'
      - 'tools/sync-subscription-node-filter.js'
      - 'tools/tests/subscription-node-filter.test.js'
      - 'tools/validate-js-overwrites.js'
      - 'tools/validate-js-engines.js'
      - 'tools/lib/js-engine-fixtures.js'
      - 'tools/tests/js-engines.test.js'
      - 'tools/js-engine-tests/**'
      - 'tools/generate-readme-visuals.js'
      - 'docs/assets/readme/**'
      - 'README.md'
      - '.github/workflows/validate-js-overwrites.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check generated README visuals
        run: node tools/generate-readme-visuals.js --check

      - name: Validate JS overwrite contracts
        run: node tools/validate-js-overwrites.js

      - name: Install isolated QuickJS test dependencies
        run: npm --prefix tools/js-engine-tests ci --ignore-scripts

      - name: Validate real QuickJS syntax and complete output equivalence
        run: |
          node --test tools/tests/js-engines.test.js
          node tools/validate-js-engines.js

      - name: Check synchronized traffic options and JS presets
        run: |
          node tools/sync-traffic-options.js --check
          node --test tools/tests/local-traffic-options.test.js tools/tests/traffic-options.test.js tools/tests/zerotier-planet-proxy.test.js

      - name: Check synchronized Node-DNS runtime adapters
        run: node tools/sync-node-dns-hints-adapters.js --check

      - name: Check synchronized node filter runtime and regressions
        run: |
          node tools/sync-subscription-node-filter.js --check
          node --test tools/tests/subscription-node-filter.test.js
