  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Validate optional configuration and hosts-only across adapters
        run: |
          npm --prefix tools/js-engine-tests ci --ignore-scripts
          node tools/generate-configuration-form.js --check
          node --test tools/tests/configuration-options.test.js tools/tests/configuration-form.test.js tools/tests/flclash-browser-export.test.js tools/tests/business-profiles.test.js tools/tests/business-profile-engines.test.js tools/tests/node-dns-hosts-only.test.js tools/tests/node-dns-hosts-only-integration.test.js tools/tests/egern-header-idempotence.test.js

      - name: Validate Karing generation and client layout
        run: |
          node tools/generate-karing.js --check
          node --test tools/tests/client-layout.test.js tools/tests/karing*.test.js

      - name: Validate JS overwrite contracts
        run: node tools/validate-js-overwrites.js

      - name: Check synchronized business DNS policy projections
        run: |
          node tools/sync-business-dns-policy.js --check
          node --test tools/tests/business-dns-policy.test.js tools/tests/business-dns-sync.test.js

      - name: Check synchronized traffic options and profile regressions
        run: |
          node tools/sync-traffic-options.js --check
          node --test tools/tests/local-traffic-options.test.js tools/tests/traffic-options.test.js tools/tests/traffic-cross-clients.test.js tools/tests/stash-traffic-options.test.js tools/tests/traffic-asset-reuse.test.js tools/tests/egern-traffic-options.test.js

      - name: Check synchronized Node-DNS runtime adapters
        run: node tools/sync-node-dns-hints-adapters.js --check

      - name: Validate OpenClash Node-DNS hint contract
        run: node tools/test-openclash-node-dns-hints.js

      - name: Validate synchronized JS and Ruby node filters
        run: |
          node tools/sync-subscription-node-filter.js --check
          node tools/sync-openclash-node-filter.js --check
          node --test tools/tests/subscription-node-filter.test.js
          node tools/test-openclash-node-filter.js

      - name: Check client capability matrix
        run: |
          node tools/generate-client-capability-matrix.js --check
          node --test tools/tests/client-capability-matrix.test.js
          node --test tools/tests/subscription-adapter-profiles.test.js

      - name: Validate cross-client artifact contracts
        run: node tools/validate-artifact-contracts.js --strict-ruby

      - name: Validate PROCESS-NAME direct whitelist
        run: node tools/validate-process-name-direct.js

      - name: Verify cached official documentation
        run: |
          shopt -s nullglob
          inventories=(docs/upstream/*/*/sources.json)
          test "${#inventories[@]}" -gt 0
          for inventory in "${inventories[@]}"; do
            node tools/cache-official-docs.js --group "${inventory%/sources.json}" --verify
          done
          node --test tools/tests/official-docs-cache.test.js tools/tests/passwall-backend-guard.test.js

      - name: Prepare official sing-box schema check binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in 1.14.3 1.13.14; do
            asset="sing-box-${version}-linux-amd64.tar.gz"
            destination="$RUNNER_TEMP/sing-box-$version"
            mkdir -p "$destination"
            digest=$(gh api "repos/SagerNet/sing-box/releases/tags/v$version" --jq ".assets[] | select(.name == \"$asset\") | .digest")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            gh release download "v$version" --repo SagerNet/sing-box --pattern "$asset" --dir "$destination"
            printf '%s  %s\n' "${digest#sha256:}" "$destination/$asset" | sha256sum --check --strict
            tar -xzf "$destination/$asset" -C "$destination"
            binary="$destination/sing-box-$version-linux-amd64/sing-box"
            test -x "$binary"
            if [ "$version" = 1.14.3 ]; then
              echo "SING_BOX_114_BIN=$binary" >> "$GITHUB_ENV"
            else
              echo "SING_BOX_113_BIN=$binary" >> "$GITHUB_ENV"
            fi
          done

      - name: Check both sing-box schemas with official cores
        run: node --test tools/tests/singbox-current-schema.test.js

      - name: Validate rule asset delivery regressions
        run: node --test tools/tests/generated-asset-url.test.js tools/tests/issue-186-asset-delivery.test.js tools/tests/rule-asset-downloads.test.js

      - name: Validate Surge Fake IP VIF capture
        run: node --test tools/tests/surge-tun-capture.test.js

      - name: Validate WeChat download routing and native coverage
        run: node --test tools/tests/issue-187-wechat-download.test.js

      - name: Validate source receipts, ordered semantics and governed exceptions
        env:
          SCKI_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          node tools/refresh-rule-quality.js --check
          node tools/validate-adfp-exceptions.js
          node tools/validate-claude-service-dependencies.js --check --strict-coverage
          node --test tools/tests/source-provenance.test.js tools/tests/fused-source-provenance.test.js tools/tests/ordered-rule-semantics.test.js tools/tests/adfp-exceptions.test.js tools/tests/claude-service-dependencies.test.js tools/tests/release-batch.test.js tools/tests/snapshot-supplemental-patch.test.js tools/tests/egern-supplemental-patch.test.js
          approval_args=()
          if [ -f rulesets/source/semantic-approval.json ]; then
            approval_args=(--expected-changes rulesets/source/semantic-approval.json)
          fi
          node tools/validate-ordered-rule-semantics.js --baseline-ref "$SCKI_BASELINE_REF" --mode domain-projection --check --output "$RUNNER_TEMP/semantic-diff.json" "${approval_args[@]}"
