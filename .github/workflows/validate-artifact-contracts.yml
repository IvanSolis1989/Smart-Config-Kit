name: Validate Artifact Contracts

on:
  pull_request:
    paths:
      - 'Clash Party/**/*.js'
      - 'FlClash/**/*.js'
      - 'Clash Meta For Android/**/*.yaml'
      - 'Stash/**/*.yaml'
      - 'OpenClash/**/*.conf'
      - 'OpenClash/**/*.sh'
      - 'Shadowrocket/**/*.conf'
      - 'Surge/**/*.conf'
      - 'Loon/**/*.conf'
      - 'Quantumult X/**/*.conf'
      - 'SingBox/**/*.json'
      - 'v2rayN/**/*.json'
      - 'Passwall/**/*.sh'
      - 'Passwall/**/*.conf'
      - 'Passwall/shunt-rules/**/*.list'
      - 'Passwall2/**/*.sh'
      - 'Passwall2/**/*.conf'
      - 'Passwall2/shunt-rules/**/*.list'
      - 'tools/generate-stash-from-cmfa.js'
      - 'tools/lib/client-capability-matrix.js'
      - 'tools/lib/subscription-adapter-profiles.js'
      - 'tools/generate-client-capability-matrix.js'
      - 'tools/tests/client-capability-matrix.test.js'
      - 'tools/tests/subscription-adapter-profiles.test.js'
      - 'tools/validate-artifact-contracts.js'
      - 'tools/validate-process-name-direct.js'
      - 'tools/runtime/**'
      - 'tools/sync-node-dns-hints-adapters.js'
      - 'tools/test-openclash-node-dns-hints.js'
      - 'tools/sync-subscription-node-filter.js'
      - 'tools/sync-openclash-node-filter.js'
      - 'tools/tests/subscription-node-filter.test.js'
      - 'tools/test-openclash-node-filter.js'
      - 'tools/fixtures/**'
      - 'docs/client-capability-matrix.json'
      - 'docs/client-capability-matrix.md'
      - 'docs/private-node-dns.md'
      - '.github/workflows/validate-artifact-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'Clash Party/**/*.js'
      - 'FlClash/**/*.js'
      - 'Clash Meta For Android/**/*.yaml'
      - 'Stash/**/*.yaml'
      - 'OpenClash/**/*.conf'
      - 'OpenClash/**/*.sh'
      - 'Shadowrocket/**/*.conf'
      - 'Surge/**/*.conf'
      - 'Loon/**/*.conf'
      - 'Quantumult X/**/*.conf'
      - 'SingBox/**/*.json'
      - 'v2rayN/**/*.json'
      - 'Passwall/**/*.sh'
      - 'Passwall/**/*.conf'
      - 'Passwall/shunt-rules/**/*.list'
      - 'Passwall2/**/*.sh'
      - 'Passwall2/**/*.conf'
      - 'Passwall2/shunt-rules/**/*.list'
      - 'tools/generate-stash-from-cmfa.js'
      - 'tools/lib/client-capability-matrix.js'
      - 'tools/lib/subscription-adapter-profiles.js'
      - 'tools/generate-client-capability-matrix.js'
      - 'tools/tests/client-capability-matrix.test.js'
      - 'tools/tests/subscription-adapter-profiles.test.js'
      - 'tools/validate-artifact-contracts.js'
      - 'tools/validate-process-name-direct.js'
      - 'tools/runtime/**'
      - 'tools/sync-node-dns-hints-adapters.js'
      - 'tools/test-openclash-node-dns-hints.js'
      - 'tools/sync-subscription-node-filter.js'
      - 'tools/sync-openclash-node-filter.js'
      - 'tools/tests/subscription-node-filter.test.js'
      - 'tools/test-openclash-node-filter.js'
      - 'tools/fixtures/**'
      - 'docs/client-capability-matrix.json'
      - 'docs/client-capability-matrix.md'
      - 'docs/private-node-dns.md'
      - '.github/workflows/validate-artifact-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Validate JS overwrite contracts
        run: node tools/validate-js-overwrites.js

      - name: Check synchronized Node-DNS runtime adapters
        run: node tools/sync-node-dns-hints-adapters.js --check

      - name: Validate OpenClash Node-DNS hint contract
        run: node tools/test-openclash-node-dns-hints.js

      - name: Validate synchronized JS and Ruby node filters
        run: |
          node tools/sync-subscription-node-filter.js --check
          node tools/sync-openclash-node-filter.js --check
          node --test tools/tests/subscription-node-filter.test.js
          node tools/test-openclash-node-filter.js

      - name: Check client capability matrix
        run: |
          node tools/generate-client-capability-matrix.js --check
          node --test tools/tests/client-capability-matrix.test.js
          node --test tools/tests/subscription-adapter-profiles.test.js

      - name: Validate cross-client artifact contracts
        run: node tools/validate-artifact-contracts.js --strict-ruby

      - name: Validate PROCESS-NAME direct whitelist
        run: node tools/validate-process-name-direct.js
