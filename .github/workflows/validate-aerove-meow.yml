name: Validate AEROVE Meow Candidate

on:
  pull_request:
    paths:
      - 'Meow内核系/**'
      - 'Mihomo内核系/FlClash/**/*.js'
      - 'rulesets/source/**'
      - 'rulesets/generated/fused/manifest.json'
      - 'tools/generate-aerove-meow.js'
      - 'tools/tests/aerove-meow-generation.test.js'
      - '.github/workflows/validate-aerove-meow.yml'
  push:
    branches: [main]
    paths:
      - 'Meow内核系/**'
      - 'Mihomo内核系/FlClash/**/*.js'
      - 'rulesets/source/**'
      - 'rulesets/generated/fused/manifest.json'
      - 'tools/generate-aerove-meow.js'
      - 'tools/tests/aerove-meow-generation.test.js'
      - '.github/workflows/validate-aerove-meow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check candidate generation and routing behavior (App/core still pending)
        run: |
          node tools/generate-aerove-meow.js --check
          node --test tools/tests/aerove-meow-generation.test.js
