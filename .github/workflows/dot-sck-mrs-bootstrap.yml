name: SCK MRS proof verification
on:
  push:
    branches: [dot/mrs-domain-proof-20261109]
permissions: {}
concurrency:
  group: dot-sck-repairs-20261109
  cancel-in-progress: false
jobs:
  verify-and-generate:
    if: github.repository == 'IvanSolis1989/Smart-Config-Kit' && github.ref == 'refs/heads/dot/mrs-domain-proof-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3'
      - uses: ./.github/actions/setup-aerove-mihomo
      - name: Verify branch baseline and generate exact reviewed output
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/dot/mrs-domain-proof-20261109 | cut -f1)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 4084f270ccd641a0e7c0c725d9721857488e6828
          git merge-base --is-ancestor 4084f270ccd641a0e7c0c725d9721857488e6828 HEAD
          test -z "$(git status --porcelain)"
          node tools/refresh-rule-quality.js
          node tools/generate-karing.js
          MIHOMO_BIN="$AEROVE_MIHOMO_BIN" node tools/generate-aerove-rule-assets.js
          node tools/generate-meow.js
          node tools/generate-configuration-form.js
          cat > "$RUNNER_TEMP/sck-expected.sha256" <<'HASHES'
          bdc3440d9e3a4c475d73b2afbaa8d8991d69fffa3097b941495992cf8415ed39  Meow内核系/Aerove Lite/rule-assets/manifest.json
          1699e370e086efc87eba912ba0264389747e2b252cbf466cbafa87fa85a64d16  Meow内核系/adapter-manifest.json
          7ae2855ab3788a4cb1ec545a9e272b027283d7dc186d2128e049e51fec029b9f  docs/configuration.html
          HASHES
          sha256sum -c "$RUNNER_TEMP/sck-expected.sha256"
          node tools/generate-configuration-form.js --check
          node tools/generate-karing.js --check
          node tools/refresh-rule-quality.js --check
          node tools/generate-meow.js --check
          MIHOMO_BIN="$AEROVE_MIHOMO_BIN" node tools/generate-aerove-rule-assets.js --check
          node tools/validate-artifact-contracts.js --strict-ruby
          MIHOMO_BIN="$AEROVE_MIHOMO_BIN" node --test tools/tests/configuration-form.test.js tools/tests/configuration-pages.test.js tools/tests/release-batch.test.js tools/tests/karing*.test.js tools/tests/ai-issue-*.test.js tools/tests/ai-responder-workflow.test.js tools/tests/local-codex-*.test.js tools/tests/fused-rule-optimizer.test.js tools/tests/source-provenance.test.js tools/tests/aerove-rule-assets.test.js
          node tools/build-configuration-pages.js --output-dir .cache/configuration-pages --commit "$GITHUB_SHA"
      - name: Render desktop light, dark, and 390px review evidence
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/sck-review" --no-save --package-lock=false playwright@1.56.1 marked@16.4.1
          "$RUNNER_TEMP/sck-review/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/sck-review/node_modules" node tools/ci/review-sck-pages.cjs
      - name: Save rendered review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sck-repair-visual-review
          path: .cache/sck-review/*.png
          retention-days: 7
      - name: Commit only the three hash-verified generated receipts and form with branch lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 4084f270ccd641a0e7c0c725d9721857488e6828
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/dot/mrs-domain-proof-20261109 | cut -f1)"
          git diff --name-only -z | python3 -c 'import sys,json; actual=set(sys.stdin.buffer.read().decode().strip("\0").split("\0")); assert actual==set(json.loads(sys.argv[1])), actual' '["Meow内核系/Aerove Lite/rule-assets/manifest.json", "Meow内核系/adapter-manifest.json", "docs/configuration.html"]'
          test -z "$(git ls-files --others --exclude-standard)"
          sha256sum -c "$RUNNER_TEMP/sck-expected.sha256"
          git add -- 'Meow内核系/Aerove Lite/rule-assets/manifest.json' 'Meow内核系/adapter-manifest.json' 'docs/configuration.html'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '[agent: iCEO] build: refresh bound provenance and configuration form'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --force-with-lease="refs/heads/dot/mrs-domain-proof-20261109:$GITHUB_SHA" origin HEAD:refs/heads/dot/mrs-domain-proof-20261109
