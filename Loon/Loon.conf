# ══════════════════════════════════════════════════════════════════════════════
#  规则引擎 — [Remote Rule] + [Rule]
#  ────────────────────────────────────────────────────────────────────────────
#  v5.2.4-Loon.4 起 Loon 规则分两段存放：
#
#  [Remote Rule] — 最终融合规则集（63 条，本段）
#      URL, policy=<策略组>, tag=<显示名>, enabled=true
#      ⚠️ 必须用 Loon 原生语法；不能写成 Surge 风格的 `RULE-SET,URL,policy`
#      （放在 [Rule] 段里 Loon 会报"语法错误"弹窗）
#
#  [Rule] — 内联规则（下方）
#      DOMAIN / DOMAIN-SUFFIX / DOMAIN-KEYWORD / IP-CIDR / DEST-PORT / SRC-PORT /
#      GEOIP / FINAL 等单行规则；两段一起参与路由决策
#      ⚠️ Loon 端口规则名是 `DEST-PORT` / `SRC-PORT`（官方 nsloon.app/docs/Rule/port_rule/）；
#      Surge/Shadowrocket/Clash 风格的 `DST-PORT,<port>,policy` 在 Loon 会报"语法错误"弹窗
#
#  规则顺序原则（原版 v5.2.2 防吞盾 + 优先级，在两段 + 内部顺序中共同保证）
#    1. 广告拦截/威胁情报（最前，强制 REJECT）
#    2. 私有网段/本地服务（DIRECT）
#    3. 按 routing-graph.js 首次命中顺序消费融合规则集
#    4. 仅保留端口、GEOIP 与 FINAL 等无法安全折叠的原生规则
#
#  融合规则边界
#    • [Remote Rule] 只下载本仓库 rulesets/generated/fused/clash/ 产物
#    • 第三方上游及目标策略映射仅在 rulesets/source/routing-graph.js 维护
#    • 编译阶段完成规范化、首次命中去重与 Loon 兼容格式转换
# ══════════════════════════════════════════════════════════════════════════════

