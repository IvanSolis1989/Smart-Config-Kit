<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>订阅链接同步</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>订阅链接同步</h1>
  <p class="intro">自动识别、自动同步：打开已登录仪表盘即可，无需填写或点按钮。</p>
  <p class="hint">在浏览器已授权的网站中识别机场名称，并自动匹配 Sub-Store 中已有的订阅。</p>
  <p id="currentSite" class="site">正在识别当前网站…</p>
  <label for="site">当前网站与已识别记录</label>
  <select id="site" disabled></select>
  <p id="automatic" class="automatic">正在读取自动同步状态…</p>
  <p id="notice" role="status" aria-live="polite" hidden></p>
  <section aria-live="polite" aria-labelledby="status">
    <strong id="status">读取状态…</strong>
    <dl class="identity">
      <dt>识别机场名</dt><dd id="siteName">等待识别</dd>
      <dt>匹配 Sub-Store 条目</dt><dd id="subscriptionName">等待自动匹配</dd>
    </dl>
    <p id="pageStage" class="diagnostic"></p>
    <small id="pageTime"></small>
    <p id="detail"></p>
    <small id="time"></small>
    <p id="pending" class="hint"></p>
    <p id="backup" class="hint"></p>
  </section>
  <details id="advanced">
    <summary>高级设置与排查</summary>
    <p class="hint">正常使用无需操作下列表单或按钮。站点访问范围由浏览器的扩展权限管理。</p>
    <label class="toggle"><input id="enabled" type="checkbox" disabled> 全局自动同步</label>
    <label for="backend">本机 Sub-Store 后端</label>
    <input id="backend" type="url" spellcheck="false" autocomplete="off" disabled>
    <label for="frontend">本机 Sub-Store 前端</label>
    <input id="frontend" type="url" spellcheck="false" autocomplete="off" disabled>
    <p class="hint">前后端均使用 http://127.0.0.1:端口。</p>
    <p id="dirty" class="hint" hidden></p>
    <button id="save" class="secondary" type="button" disabled>保存全局设置</button>
    <div class="actions">
      <button id="sync" type="button" disabled>手动重试当前网站</button>
      <button id="check" class="secondary" type="button" disabled>只验证，不写入</button>
    </div>
    <button id="restore" class="text" type="button" disabled>撤销当前网站上次替换</button>
  </details>
  <p class="foot">弹窗只显示识别结果、节点数与时间，不显示订阅链接；扩展不读取密码、Cookie 或登录 Token。</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
