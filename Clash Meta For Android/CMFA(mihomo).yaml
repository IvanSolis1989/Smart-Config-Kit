# ================================================================
# Clash Smart v6.0.14-cmfa.7 - CMFA (Clash Meta for Android) 配置
# Build: 2026-09-30
# 架构：proxy-providers 订阅 + 22 url-test 区域组（11 全部 + 11 家宽）+ 33 业务策略组 + 132 融合 rule-providers / 151 rules
# 规则源：rulesets/source/routing-graph.js v6.0.14；客户端基线：Clash Party v6.0.14
# 变更历史：见 `Clash Meta For Android/CHANGELOG.md`
# 空地区池拒绝连接；请选有节点的地区或全球组。类型过滤已验收 Mihomo v1.19.29。
# ================================================================
# ★ 快速上手：
#   1. 将 proxy-providers → Subscribe → url 替换为你的机场订阅链接
#   2. 导入 CMFA 即可使用
#   3. 首次导入后 CMFA 会自动下载 Loyalsoldier 增强版 GeoIP / GeoSite 数据库
# ================================================================
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-idle: 30
keep-alive-interval: 15
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: 'https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/geoip.dat'
  mmdb: 'https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb'
  asn: 'https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb'
  geosite: 'https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
hosts:
  'dns.alidns.com':
  - 223.5.5.5
  - 223.6.6.6
  'doh.pub':
  - 119.29.29.29
  'dns.google':
  - 8.8.8.8
  - 8.8.4.4
  'cloudflare-dns.com':
  - 1.1.1.1
  - 1.0.0.1
profile:
  store-selected: true
  store-fake-ip: true
  tracing: true
dns:
  enable: true
  ipv6: false
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localdomain
  - +.home.arpa
  - +.msftconnecttest.com
  - +.msftncsi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - +.in-addr.arpa
  - +.ip6.arpa
  - time.*.com
  - time.*.gov
  - ntp.*.com
  - pool.ntp.org
  - +.ntp.org
  - +.pool.ntp.org
  - +.market.xiaomi.com
  - +.stun.*.*
  - +.stun.*.*.*
  - +.turn.*.*
  - +.turn.*.*.*
  - +.n.n.srv.nintendo.net
  - +.stun.playstation.net
  - +.xboxlive.com
  - stun.l.google.com
  - stun1.l.google.com
  - stun2.l.google.com
  - stun3.l.google.com
  - stun4.l.google.com
  - global.turn.twilio.com
  - auth.docker.io
  - registry-1.docker.io
  - index.docker.io
  - hub.docker.com
  - production.cloudflare.docker.com
  - +.push.apple.com
  - +.pub.3gppnetwork.org
  - +.bing.com
  - +.rustdesk.com
  # v5.4.19 #3 借鉴 Proxy-override：远控/游戏/P2P 需真实 IP 才能打洞/直连（同 RustDesk 语义）
  - +.todesk.com
  - +.oray.com
  - +.sunlogin.com
  - +.teamviewer.com
  - +.anydesk.com
  - +.battlenet.com.cn
  - +.wotgame.cn
  - +.wggames.cn
  - +.wowsgame.cn
  - +.mcdn.bilivideo.cn
  - +.miwifi.com
  - +.courier.push.apple.com
  - +.miui.com
  - +.xiaomi.com
  - +.xiaomi.net
  - +.mijia.tech
  - +.gotui.com
  # FIX#HOSTS-ALIGN: use-hosts 改 true（对齐主线，hosts 已固定全部 DoH 域名 IP，消除 fake-ip 冷启动循环依赖）
  use-hosts: true
  use-system-hosts: false
  cache-algorithm: arc
  respect-rules: true
  default-nameserver:
  - 'https://223.5.5.5/dns-query'
  - 'https://223.6.6.6/dns-query'
  - 'https://8.8.8.8/dns-query'
  - 'https://1.1.1.1/dns-query'
  - '223.5.5.5'
  nameserver:
  - 'https://dns.alidns.com/dns-query'
  - 'https://doh.pub/dns-query'
  proxy-server-nameserver:
  - 'https://cloudflare-dns.com/dns-query'
  - 'https://dns.google/dns-query'
  - 'https://dns.alidns.com/dns-query'
  - 'https://doh.pub/dns-query'
  direct-nameserver:
  - 'https://dns.alidns.com/dns-query'
  - 'https://doh.pub/dns-query'
  # v5.4.19 #5 借鉴 Proxy-override：让 direct-nameserver 也遵循 nameserver-policy（默认 false 会忽略它）。policy 覆盖境外 CDN 与 geosite 级分流。
  direct-nameserver-follow-policy: true
  nameserver-policy:
    geosite:cn:
    - 'https://dns.alidns.com/dns-query'
    - 'https://doh.pub/dns-query'
    geosite:geolocation-!cn:
    - 'https://cloudflare-dns.com/dns-query'
    - 'https://dns.google/dns-query'
    '+.jsdelivr.net':
    - 'https://cloudflare-dns.com/dns-query'
    - 'https://dns.google/dns-query'
    '+.github.com':
    - 'https://cloudflare-dns.com/dns-query'
    - 'https://dns.google/dns-query'
    '+.githubusercontent.com':
    - 'https://cloudflare-dns.com/dns-query'
    - 'https://dns.google/dns-query'
    '+.githubassets.com':
    - 'https://cloudflare-dns.com/dns-query'
    - 'https://dns.google/dns-query'
    '+.fastly.net':
    - 'https://cloudflare-dns.com/dns-query'
    - 'https://dns.google/dns-query'
  fallback:
  - 'https://cloudflare-dns.com/dns-query'
  - 'https://dns.google/dns-query'
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
    - geolocation-!cn
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
    - 127.0.0.0/8
    - 10.0.0.0/8
    - 192.168.0.0/16
    domain: []
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports:
      - '80'
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - '443'
      - '8443'
    QUIC:
      ports:
      - '443'
      - '8443'
      - '4433'
  skip-domain:
  - +.push.apple.com
  skip-dst-address:
  - 91.105.192.0/23
  - 91.108.4.0/22
  - 91.108.8.0/21
  - 91.108.16.0/21
  - 91.108.56.0/22
  - 95.161.64.0/20
  - 149.154.160.0/20
  - 185.76.151.0/24
  - '2001:67c:4e8::/48'
  - '2001:b28:f23c::/47'
  - '2001:b28:f23f::/48'
  - '2a0a:f280:203::/48'
  force-domain: []
  skip-src-address: []
proxy-providers:
  Subscribe:
    type: http
    url: 'https://my.example.com/your-subscription-url'
    interval: 86400
    path: ./proxy_providers/subscribe.yaml
    health-check:
      enable: true
      url: 'https://www.gstatic.com/generate_204'
      interval: 300
    # v5.4.20 #6 借鉴 Proxy-override：补充 junk 关键词（免费/试用/应急 中文子串；Sign/Login/Register/Help/FAQ 英文用 \b 词边界，RE2 下避免误伤 Signal 等）
    exclude-filter: '(?i)(导航网址|距离下次重置|剩余流量|套餐到期|网址导航|官网|订阅|到期|剩余|重置|免费|试用|应急|\bSign\b|\bLogin\b|\bRegister\b|\bHelp\b|\bFAQ\b)'
