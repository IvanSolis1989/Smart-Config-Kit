[general]
server_check_url=http://www.gstatic.com/generate_204
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
running_mode_trigger=auto, auto, auto
ssid_suspended_list=Hidden Network, 非法ssid
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icloud.com, *.icloud.com.cn, *.10010.com, id6.me, lens.l.google.com, stun.l.google.com, *.nflxvideo.net, *.apple.com, *.mcdn.bilivideo.cn, *.sogouimg.com, *.sogoucdn.com
network_check_url=http://www.gstatic.com/generate_204
# v5.4.22 N/A#1：QX fallback_udp_policy 是引擎级，不支持 AND/NOT 白名单豁免；QUIC 精细化由 mihomo 产物承载
fallback_udp_policy=reject

[dns]
# 对齐 Clash Party v5.4.21：DoH-over-IP bootstrap + 明文兜底
# QX 语法：server= 只接受 IP / IP:port / /域名/IP（明文兜底）；DoH URL 必须用 doh-server=
# v5.4.21 #4 借鉴 Proxy-override：doh-server 改为 IP-host DoH，消除 bootstrap 泄漏。
server=223.5.5.5
server=119.29.29.29
server=1.1.1.1
server=8.8.8.8
doh-server=https://223.5.5.5/dns-query
doh-server=https://223.6.6.6/dns-query
doh-server=https://8.8.8.8/dns-query
doh-server=https://1.1.1.1/dns-query
# ⚠️ QX doh-server 多条目受 iOS 版本限制；首条保留最可靠的 AliDNS
# iOS 15+ 可并发多条 DoH；旧 iOS 可能限制可用条目数
# DNS 劫持（Netflix / Chromecast 硬编码 DNS）
# ⚠️ server=/domain/system 语法在黑苹果文档中未确认；已在 dns_exclusion_list 覆盖 *.apple.com / *.icloud.com
# 原行（已移除，由 dns_exclusion_list 替代）：
#   server=/*.apple.com/system
#   server=/*.icloud.com/system
no-ipv6

