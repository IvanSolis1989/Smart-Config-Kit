# ══════════════════════════════════════════════════════════════════════════════
#  Quantumult X Smart v6.0.14-QX.6 — Quantumult X 版（从 Clash Party v6.0.14 迁移）
#  Build: 2026-09-29 | Target: Quantumult X iOS (App Store 付费正版)
#  架构：22 区域 url-latency-benchmark（11 全部 + 11 家宽）+ 33 业务 static + 69 融合 remote URL filters
#  v6.0.14-QX.6: 为微信 HTTPDNS 两个精确域名增加前置直连例外，避免 BlockHttpDNS 规则拦截微信图片模块
#  v5.4.32: FIX#168-CN-GAME 国内游戏前置到国外游戏宽规则之前，避免 HoYoverse / Game / category-games 抢先代理
